<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .icon { fill: #D4BE4A; opacity: 0.2; }
    </style>
  </defs>
  
  <!-- Star -->
  <path class="icon" d="M30 15 L34 25 L45 25 L36 32 L39 42 L30 36 L21 42 L24 32 L15 25 L26 25 Z" transform="translate(10, 10) scale(0.8)" />
  
  <!-- Heart -->
  <path class="icon" d="M100 30 C 100 30, 85 10, 70 30 C 60 45, 80 60, 100 80 C 120 60, 140 45, 130 30 C 115 10, 100 30, 100 30 Z" transform="translate(-20, 0) scale(0.3)" />

  <!-- Cat Face -->
  <g class="icon" transform="translate(120, 60) scale(0.6)">
    <circle cx="20" cy="20" r="18" />
    <polygon points="2,12 8,2 18,10" />
    <polygon points="38,12 32,2 22,10" />
  </g>

  <!-- Sparkle -->
  <path class="icon" d="M10 0 Q 12 8 20 10 Q 12 12 10 20 Q 8 12 0 10 Q 8 8 10 0 Z" transform="translate(50, 80) scale(0.8)" />

  <!-- Moon/Crescent -->
  <path class="icon" d="M10 0 A 10 10 0 1 1 10 20 A 8 8 0 1 0 10 0 Z" transform="translate(150, 20) rotate(30)" />

  <!-- Cloud -->
  <path class="icon" d="M10 20 A 10 10 0 0 1 20 10 A 12 12 0 0 1 40 10 A 10 10 0 0 1 50 20 H 10 Z" transform="translate(80, 120) scale(0.6)" />
  
  <!-- Smol Happy Face -->
  <g class="icon" transform="translate(30, 140) scale(0.8)">
      <circle cx="15" cy="15" r="12" fill="none" stroke="#D4BE4A" stroke-width="2" />
      <circle cx="10" cy="12" r="1.5" fill="#D4BE4A" />
      <circle cx="20" cy="12" r="1.5" fill="#D4BE4A" />
      <path d="M10 18 Q 15 23 20 18" stroke="#D4BE4A" stroke-width="1.5" fill="none" />
  </g>

  <!-- Cherry -->
  <g class="icon" transform="translate(160, 100) scale(0.5)">
      <circle cx="10" cy="25" r="8" />
      <circle cx="25" cy="22" r="8" />
      <path d="M10 25 Q 15 0 30 5 M 25 22 Q 20 0 30 5" stroke="#D4BE4A" stroke-width="2" fill="none" />
  </g>

  <!-- Bow -->
  <path class="icon" d="M10 10 C 0 0, 0 20, 10 10 C 20 20, 20 0, 10 10 Z" transform="translate(100, 160) scale(1.5)" />

  <!-- Another Star -->
  <path class="icon" d="M20 10 L23 18 L32 18 L25 24 L28 32 L20 27 L12 32 L15 24 L8 18 L17 18 Z" transform="translate(140, 140) scale(0.6)" />

</svg>
